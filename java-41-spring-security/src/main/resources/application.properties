# ============================================================
# Active datasource: PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/security_db
spring.datasource.username=security_user
spring.datasource.password=security_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# ============================================================
# Alternative datasource: MySQL
# Uncomment this block and comment the PostgreSQL block above
# when you want to run the same application with MySQL.
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3307/my_company_db?allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.username=aydin
# spring.datasource.password=123456!
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=validate

# ============================================================
# Flyway
# {vendor} resolves to the active database vendor.
# PostgreSQL -> db/migration/postgresql
# MySQL      -> db/migration/mysql
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.validate-on-migrate=true

# ============================================================
# Token lifecycle
# Access token: 15 minutes
# Refresh token: 7 days
# ============================================================
bezkoder.app.jwtSecret=======================BezKoder=Spring===========================
bezkoder.app.jwtExpirationMs=900000
bezkoder.app.refreshExpirationMs=604800000
