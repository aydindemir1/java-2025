spring.application.name=java-40-spring-boot-redis
server.port=8091
spring.profiles.active=local
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.com.aydindemir.redis=INFO
app.redis.key-prefix=java40
app.redis.product-cache-ttl=10m
app.redis.session-ttl=30m
app.redis.idempotency-ttl=15m
app.redis.lock-ttl=10s
app.redis.rate-limit-window=60s
app.redis.rate-limit-max-requests=10
